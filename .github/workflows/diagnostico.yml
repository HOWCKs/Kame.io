name: Diagnóstico (temporário)

# Ferramenta de desenvolvimento: roda analyze + test e devolve a saída
# completa num comentário do PR, para depurar sem acesso aos logs.
# REMOVER DEPOIS QUE O CI ESTIVER VERDE.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  flutter:
    name: analyze + test (com relatório)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          echo "EXIT_ANALYZE=$?" >> analyze.txt
          cat analyze.txt

      - name: Testar
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          echo "EXIT_TEST=$?" >> test.txt
          tail -60 test.txt

      - name: Comentar relatório no PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then echo "sem PR aberto para ${GITHUB_REF_NAME}"; exit 0; fi
          {
            echo "### Diagnóstico Flutter · \`${GITHUB_SHA:0:7}\`"
            echo
            echo "<details><summary>flutter analyze</summary>"
            echo
            echo '```'
            tail -80 analyze.txt
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>flutter test</summary>"
            echo
            echo '```'
            head -30 test.txt
            echo '...'
            grep -m 1 -A 22 'EXCEPTION CAUGHT' test.txt
            echo '```'
            echo "</details>"
          } > body.md
          gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" -F body=@body.md > /dev/null
          echo "relatório publicado no PR #${PR}"

  apk:
    name: Build Android (com relatório)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle.txt 2>&1
          echo "EXIT_GRADLE=$?" >> gradle.txt
          tail -40 gradle.txt

      - name: Comentar relatório no PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then echo "sem PR aberto"; exit 0; fi
          {
            echo "### Diagnóstico Android · \`${GITHUB_SHA:0:7}\`"
            echo
            echo '```'
            echo '--- fim do log ---'
            tail -25 gradle.txt
            echo
            echo '--- erros ---'
            grep -n -i -m 3 -A 14 -E '^FAILURE|What went wrong|error:|Execution failed' gradle.txt || echo '(sem casamento)'
            echo '```'
          } > apk.md
          gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" -F body=@apk.md > /dev/null
          echo "relatório do APK publicado no PR #${PR}"
