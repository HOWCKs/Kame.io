name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which APK flavours to build. Manual runs honour the dropdown;
  # pushes to main and tags build both.
  matrix:
    name: Definir matriz de builds
    runs-on: ubuntu-latest
    outputs:
      types: ${{ steps.pick.outputs.types }}
    steps:
      - id: pick
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          case "$TYPE" in
            debug)   echo 'types=["debug"]'   >> "$GITHUB_OUTPUT" ;;
            release) echo 'types=["release"]' >> "$GITHUB_OUTPUT" ;;
            *)       echo 'types=["debug","release"]' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Matriz: $(tail -n1 "$GITHUB_OUTPUT")"

  build:
    name: Compilar APK (${{ matrix.type }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # necessário para anexar o APK à Release em tags v*
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJSON(needs.matrix.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # Cache for the Gradle distribution + dependency cache. The wrapper jar is
      # committed, so the build itself never needs a pre-installed Gradle.
      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Versões do toolchain
        run: |
          flutter --version
          java -version

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código estático
        run: flutter analyze --no-fatal-infos

      - name: Rodar testes
        run: flutter test

      # A keystore só é usada se os secrets estiverem configurados; sem eles o
      # build assina com a keystore de debug, que também gera APK instalável.
      - name: Preparar assinatura de release (opcional)
        if: ${{ matrix.type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 não configurado — o APK de release será assinado com a keystore de debug (instalável, mas não publicável na Play Store)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Keystore de release configurada."

      - name: Compilar APK (${{ matrix.type }})
        working-directory: android
        run: ./gradlew assemble${{ matrix.type }} --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          SRC="build/app/outputs/flutter-apk/app-${{ matrix.type }}.apk"
          test -f "$SRC" || { echo "::error::APK não encontrado em $SRC"; exit 1; }
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          DEST="build/app/outputs/flutter-apk/kame-io-${VERSION}-${{ matrix.type }}.apk"
          mv "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          ls -lh "$DEST"

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: kame-io-${{ matrix.type }}-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK à Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
