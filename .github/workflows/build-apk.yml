name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Definir matriz de builds
    runs-on: ubuntu-latest
    outputs:
      types: ${{ steps.pick.outputs.types }}
    steps:
      - id: pick
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          case "$TYPE" in
            debug)   echo 'types=["debug"]'   >> "$GITHUB_OUTPUT" ;;
            release) echo 'types=["release"]' >> "$GITHUB_OUTPUT" ;;
            *)       echo 'types=["debug","release"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Compilar APK (${{ matrix.type }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJSON(needs.matrix.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código estático
        run: flutter analyze --no-fatal-infos

      - name: Rodar testes
        run: flutter test

      - name: Preparar assinatura de release (opcional)
        if: ${{ matrix.type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Sem keystore de release — assinando com a keystore de debug (instalável)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compilar APK (${{ matrix.type }})
        working-directory: android
        run: ./gradlew assemble${{ matrix.type }} --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          set -euo pipefail
          # O Gradle roda dentro de android/ (e não via `flutter build`), então o
          # APK sai em android/app/build/outputs/apk/<variant>/. A busca aceita
          # também o caminho do `flutter build`, para o passo não quebrar se o
          # comando de build mudar no futuro.
          SRC="$(find android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$SRC" ]; then
            SRC="$(find build -type f -name '*.apk' 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SRC" ]; then
            echo "::error::nenhum APK encontrado depois do build"
            find . -maxdepth 7 -name '*.apk' 2>/dev/null | head -n 20 || true
            exit 1
          fi
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          mkdir -p build/app/outputs/flutter-apk
          DEST="build/app/outputs/flutter-apk/kame-io-${VERSION}-${{ matrix.type }}.apk"
          mv "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          ls -lh "$DEST"

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: kame-io-${{ matrix.type }}-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK à Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
