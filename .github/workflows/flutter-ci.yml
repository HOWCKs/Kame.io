name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analisar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      # Informativo: o diff aparece no log, mas não reprova o build (a
      # formatação não muda comportamento e pode ser aplicada depois).
      - name: Conferir formatação
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisar código estático
        run: flutter analyze --no-fatal-infos

      - name: Rodar testes
        run: flutter test --reporter expanded
