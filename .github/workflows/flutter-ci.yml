name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze + test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código estático
        run: flutter analyze --no-fatal-infos

      - name: Rodar testes
        run: flutter test

  cardapio:
    name: Smoke test do cardápio (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cardapio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar jsdom
        run: npm install --no-audit --no-fund

      - name: Sintaxe dos scripts
        run: |
          for f in assets/js/*.js; do node --check "$f" || exit 1; done

      - name: Percorrer o fluxo (buscar → montar → pedir → enviar)
        run: npm test
