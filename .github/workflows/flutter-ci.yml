name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analisar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      # Informativo: o diff aparece no log, mas não reprova o build (a
      # formatação não muda comportamento e pode ser aplicada depois).
      - name: Conferir formatação
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test | tee format.log

      - name: Analisar código estático
        continue-on-error: true
        run: flutter analyze --no-fatal-infos | tee analyze.log

      - name: Rodar testes
        continue-on-error: true
        run: flutter test --reporter expanded | tee test.log

      - name: Resumo
        if: always()
        run: |
          {
            echo '### Qualidade do código'
            echo
            echo '**Formatação**'
            echo '```'
            tail -n 20 format.log 2>/dev/null || echo 'sem saída'
            echo '```'
            echo
            echo '**Analisar**'
            echo '```'
            tail -n 80 analyze.log 2>/dev/null || echo 'sem saída'
            echo '```'
            echo
            echo '**Testes**'
            echo '```'
            tail -n 60 test.log 2>/dev/null || echo 'sem saída'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: |
            format.log
            analyze.log
            test.log
          if-no-files-found: warn
          retention-days: 7
