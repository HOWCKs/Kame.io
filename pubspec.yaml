name: kame_io
description: "Kame.io — câmera com linguagem CLAY MORPHIST: matéria, luz e movimento."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  # Guarda as capturas no diretório de documentos (persistência do Atlas).
  path_provider: ^2.1.4
  # Fluxo explícito de permissão da câmera (o pedido acontece na tela certa,
  # não no meio do boot).
  permission_handler: ^11.3.1
  # Exportar / compartilhar uma forma.
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
